<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>國安常識搶答題庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: 比賽台式 — 頂部法例「分區」導航 + 單欄題卡；抽題模式為全屏投影卡 */
:root{
  --bg:#f3f5f4; --paper:#ffffff; --ink:#15202b; --muted:#5b6b72; --line:#d9e1df;
  --teal:#1f7a72; --teal-soft:#e2f0ee; --red:#b8322a; --red-soft:#f8e6e3; --gold:#b98a22;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --paper:#172226; --ink:#e7eeec; --muted:#93a5a8; --line:#2a3a3e;
  --teal:#5cc4b8; --teal-soft:#16302e; --red:#ef7d72; --red-soft:#3a1f1d; --gold:#e0b65a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --paper:#172226; --ink:#e7eeec; --muted:#93a5a8; --line:#2a3a3e;
  --teal:#5cc4b8; --teal-soft:#16302e; --red:#ef7d72; --red-soft:#3a1f1d; --gold:#e0b65a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto}
header.top{padding-block:28px 12px;display:grid;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--teal);font-weight:700}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--paper);font-weight:700}
.chip .n{font-family:var(--f-mono);font-size:12px;opacity:.75;margin-left:4px}
.chip:focus-visible,.btn:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.btn{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.search{font:inherit;font-size:14px;flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 10px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:grid;gap:12px;margin-top:16px}
.sec-h{font-family:var(--f-display);font-weight:900;font-size:20px;margin:18px 0 0;display:flex;gap:10px;align-items:baseline}
.sec-h small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.num{font-family:var(--f-mono);color:var(--muted)}
.tag{border-radius:4px;padding:1px 7px;font-weight:700}
.tag.src{background:var(--teal-soft);color:var(--teal)}
.tag.typ{border:1px solid var(--line);color:var(--muted);font-weight:500}
.tag.neg{background:var(--red-soft);color:var(--red)}
.q{font-size:17px;font-weight:500;margin:0}
.q .not{color:var(--red);font-weight:700;text-decoration:underline;text-underline-offset:3px}
ol.opts{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ol.opts li{display:flex;gap:10px;padding:4px 8px;border-radius:6px}
ol.opts .L{font-family:var(--f-mono);font-weight:500;color:var(--muted);flex:none}
.reveal ol.opts li.ok{background:var(--teal-soft);font-weight:700}
.reveal ol.opts li.ok .L{color:var(--teal)}
.ans{display:none;gap:8px;align-items:baseline;border-top:1px dashed var(--line);padding-top:8px}
.reveal .ans{display:flex;flex-wrap:wrap}
.ans .ev{flex-basis:100%;font-size:14px;color:var(--muted);line-height:1.6}
.ans .k2{font-size:12px;font-weight:700;color:var(--teal);letter-spacing:.1em;margin-right:6px}
.stage .ans .ev{font-size:clamp(14px,1.8vw,20px)}
.ans .k{font-size:12px;font-weight:700;color:var(--red);letter-spacing:.1em;flex:none}
.ans .v{font-weight:700}
.peek{justify-self:start;font:inherit;font-size:13px;color:var(--teal);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.reveal .peek{display:none}
.empty{color:var(--muted);padding:24px 0}
/* 抽題模式 */
.stage{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.stage-card{align-self:center;justify-self:center;width:min(980px,100%);display:grid;gap:18px;overflow:auto;min-height:0}
.stage .q{font-size:clamp(22px,3.4vw,38px);line-height:1.45;font-family:var(--f-display);font-weight:600}
.stage ol.opts{gap:8px}
.stage ol.opts li{font-size:clamp(18px,2.6vw,28px);padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.stage .ans{font-size:clamp(20px,3vw,32px)}
.stage .ans .k{font-size:clamp(14px,1.6vw,18px)}
.timer{font-family:var(--f-mono);font-size:clamp(28px,5vw,48px);font-variant-numeric:tabular-nums;color:var(--teal);min-width:3ch;text-align:right}
.timer.hot{color:var(--red)}
.stage-bottom{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.card,.stage-card{transition:background .15s}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">全港學界國家安全常識挑戰賽 · 中學組備賽</div>
    <h1>國安常識搶答題庫</h1>
    <p class="sub">按大會導讀範圍出題，範圍內每一條條文最少一題，每題附條文出處及原文句。題型仿照往屆比賽：「根據《某法》第N條……」、「以下哪一項不是……」及國情時事。</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="bar">
    <div class="row" id="srcChips" role="group" aria-label="法例"></div>
    <div class="row">
      <button class="chip" id="tAll" aria-pressed="true">全部題型</button>
      <button class="chip" id="tMc" aria-pressed="false">選擇題</button>
      <button class="chip" id="tSa" aria-pressed="false">簡答題</button>
      <button class="chip" id="tNeg" aria-pressed="false">只看「哪一項不是」</button>
      <span class="sep"></span>
      <button class="btn ghost" id="toggleAns">顯示全部答案</button>
      <button class="btn" id="drill">抽題模式</button>
    </div>
    <div class="row">
      <input class="search" id="q" type="search" placeholder="搜尋題目、條文或答案，例如：保安局局長、第四十三條">
      <span class="count" id="count"></span>
    </div>
  </div>

  <main class="list" id="list"></main>
</div>

<div class="stage" id="stage" hidden>
  <div class="stage-top">
    <div class="meta" id="sMeta"></div>
    <div class="row"><span class="count" id="sPos"></span><span class="timer" id="sTimer">10</span></div>
  </div>
  <div class="stage-card" id="sCard"></div>
  <div class="stage-bottom">
    <button class="btn ghost" id="sTime">開始 10 秒計時</button>
    <button class="btn ghost" id="sShow">顯示答案</button>
    <button class="btn" id="sNext">下一題</button>
    <button class="btn ghost" id="sExit">離開</button>
  </div>
</div>

<script>

const SRC = {P:'憲法序言',C:'憲法',B:'基本法',N:'香港國安法',G:'國安法導讀',O:'維護國家安全條例',W:'白皮書',S:'認識國家安全',E:'國家安全展覽廳',F:'十五五規劃',H:'香港五年規劃',A:'施政報告',L:'國安法網上展覽',K:'航天',M:'北部都會區'};
const SRC_FULL = {P:'《憲法》序言',C:'《憲法》第四十至七十條',B:'《基本法》指定條文',N:'《香港國安法》',G:'《香港國安法》導讀小冊子',O:'《維護國家安全條例》指定條文',W:'《「一國兩制」下香港維護國家安全的實踐》白皮書第三部分',S:'全民國家安全教育日網頁「認識國家安全」',E:'國家安全展覽廳（展廳簡介、參觀指南）',F:'「十五五」規劃綱要第三十二、三十五、五十五章',H:'香港首個五年規劃（2026-2030年）第二、六篇',A:'《行政長官2026年施政報告》第三章',L:'《香港國安法》公布實施6周年網上展覽',K:'「同圓航天夢 共襄復興業」主題網頁',M:'北部都會區「四大區域」'};
const L = 'ABCD';
const st = {src:'ALL', type:'all', neg:false, showAll:false, q:''};
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hiNot = s => esc(s).replace(/(不是|不屬|不正確)/, '<span class="not">$1</span>');
const ansText = d => d.type==='mc' ? L[d.ci]+'　'+d.opts[d.ci] : d.ans;

function stats(){
  const c = {}; DATA.forEach(d => c[d.src]=(c[d.src]||0)+1);
  const mc = DATA.filter(d=>d.type==='mc').length;
  $('stats').innerHTML = `<span>共 <b>${DATA.length}</b> 題</span><span>選擇題 <b>${mc}</b></span><span>簡答題 <b>${DATA.length-mc}</b></span><span>「哪一項不是」 <b>${DATA.filter(d=>d.neg).length}</b></span>`;
  const chips = [['ALL','全部',DATA.length], ...Object.keys(SRC).map(k=>[k,SRC[k],c[k]||0])];
  $('srcChips').innerHTML = chips.map(([k,n,v]) => `<button class="chip" data-src="${k}" aria-pressed="${k===st.src}">${n}<span class="n">${v}</span></button>`).join('');
}
function filtered(){
  const term = st.q.trim();
  return DATA.filter(d => (st.src==='ALL'||d.src===st.src) && (st.type==='all'||d.type===st.type) && (!st.neg||d.neg)
    && (!term || (d.q+d.art+ansText(d)+(d.opts||[]).join('')).includes(term)));
}
function cardHTML(d, big){
  const opts = d.type==='mc' ? `<ol class="opts">${d.opts.map((o,i)=>`<li class="${i===d.ci?'ok':''}"><span class="L">${L[i]}</span><span>${esc(o)}</span></li>`).join('')}</ol>` : '';
  return `<div class="meta"><span class="num">#${String(d.id).padStart(3,'0')}</span><span class="tag src">${SRC[d.src]}${d.art===SRC[d.src]||d.art==='序言'?'':'・'+esc(d.art)}</span><span class="tag typ">${d.type==='mc'?'選擇題':'簡答題'}</span>${d.neg?'<span class="tag neg">哪一項不是</span>':''}</div>
  <p class="q">${hiNot(d.q)}</p>${opts}${big?'':'<button class="peek" type="button">看答案</button>'}
  <div class="ans"><span class="k">答案</span><span class="v">${esc(ansText(d))}</span>${d.ev?`<span class="ev"><span class="k2">原文</span>「${esc(d.ev)}」</span>`:''}</div>`;
}
function render(){
  const list = filtered(); let html = '', last = null;
  list.forEach(d => {
    if (st.src==='ALL' && d.src!==last){ html += `<h2 class="sec-h">${SRC_FULL[d.src]}<small>${DATA.filter(x=>x.src===d.src).length} 題</small></h2>`; last = d.src; }
    html += `<article class="card${st.showAll?' reveal':''}" data-id="${d.id}">${cardHTML(d)}</article>`;
  });
  $('list').innerHTML = html || '<p class="empty">沒有符合條件的題目。試試清除搜尋字眼或選「全部」。</p>';
  $('count').textContent = `顯示 ${list.length} 題`;
  document.querySelectorAll('#srcChips .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.src===st.src));
  [['tAll','all'],['tMc','mc'],['tSa','sa']].forEach(([id,t]) => $(id).setAttribute('aria-pressed', st.type===t));
  $('tNeg').setAttribute('aria-pressed', st.neg);
  $('toggleAns').textContent = st.showAll ? '隱藏全部答案' : '顯示全部答案';
}
$('srcChips').addEventListener('click', e => { const b = e.target.closest('.chip'); if(!b) return; st.src = b.dataset.src; render(); });
$('tAll').onclick = () => { st.type='all'; render(); };
$('tMc').onclick = () => { st.type='mc'; render(); };
$('tSa').onclick = () => { st.type='sa'; render(); };
$('tNeg').onclick = () => { st.neg=!st.neg; render(); };
$('toggleAns').onclick = () => { st.showAll=!st.showAll; render(); };
$('q').addEventListener('input', e => { st.q = e.target.value; render(); });
$('list').addEventListener('click', e => { if (e.target.closest('.peek')) e.target.closest('.card').classList.add('reveal'); });

// 抽題模式
let deck = [], at = 0, tick = null, left = 10;
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function stopTimer(){ clearInterval(tick); tick=null; }
function setTimer(n){ left=n; $('sTimer').textContent=n; $('sTimer').classList.toggle('hot', n<=3); }
function showDrill(){
  const d = deck[at]; stopTimer(); setTimer(10);
  $('sCard').className = 'stage-card'; $('sCard').innerHTML = cardHTML(d, true);
  $('sMeta').innerHTML = ''; $('sPos').textContent = `${at+1} / ${deck.length}`;
  $('sShow').textContent = '顯示答案';
}
$('drill').onclick = () => { deck = shuffle(filtered().slice()); if(!deck.length) return; at = 0; $('stage').hidden = false; showDrill(); };
$('sNext').onclick = () => { at = (at+1) % deck.length; if(at===0) shuffle(deck); showDrill(); };
$('sShow').onclick = () => { const c=$('sCard'); c.classList.toggle('reveal'); $('sShow').textContent = c.classList.contains('reveal')?'隱藏答案':'顯示答案'; stopTimer(); };
$('sTime').onclick = () => { stopTimer(); setTimer(10); tick = setInterval(() => { setTimer(left-1); if(left<=0) stopTimer(); }, 1000); };
$('sExit').onclick = () => { stopTimer(); $('stage').hidden = true; };
document.addEventListener('keydown', e => {
  if ($('stage').hidden) return;
  if (e.key==='ArrowRight'||e.key==='n') $('sNext').click();
  else if (e.key===' '){ e.preventDefault(); $('sShow').click(); }
  else if (e.key==='t') $('sTime').click();
  else if (e.key==='Escape') $('sExit').click();
});
stats(); render();
</script>
